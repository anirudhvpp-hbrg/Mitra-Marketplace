<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Mitra</title>
<link rel="stylesheet" href="/static/mitra.css">
<style>
  .chat { max-width: 760px; margin: 0 auto; padding: 20px 16px 170px; }
  .msg { margin: 16px 0; animation: msg-in .25s var(--ease); }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
  .msg.you { text-align: right; }
  .msg.you .bubble { display: inline-block; background: var(--navy-800); color: #fff; padding: 9px 15px; border-radius: 16px 16px 4px 16px; text-align: left; max-width: 85%; white-space: pre-wrap; }
  .msg.it .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 4px 18px; box-shadow: var(--elev-1); }
  .msg .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 6px; }
  .msg .meta button { min-height: 26px; padding: 2px 10px; font-size: 12px; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 14px 16px; }
  .composer .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { font-family: var(--sans); font-size: 16px; line-height: 24px; }
  .dots i { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--action); animation: pulse 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
</style>
</head>
<body>
<div class="chat" id="chat">
  <div class="card" id="intro" style="padding:18px 20px">
    <div class="row"><strong id="model" style="flex:1">Checking the model…</strong><button class="ghost" id="new" hidden>New conversation</button></div>
    <div class="muted small" id="why" style="margin-top:4px"></div>
    <div class="row" id="tries" hidden style="margin-top:12px;gap:6px"></div>
  </div>
</div>
<div class="composer"><div class="inner">
  <textarea id="q" rows="2" placeholder="Ask anything. Enter sends, Shift+Enter makes a new line." aria-label="Your question"></textarea>
  <button class="primary" id="send">Ask</button>
</div></div>
<script src="/static/sdk.js"></script>
<script>
const M = mitra, $ = (s) => document.querySelector(s);
const KEY = 'mitra.assistant.conversation';
let turns = [];   // [{role: 'user' | 'assistant', content, meta}]; kept in this browser so a reload does not lose it
try { turns = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(turns.slice(-40))); } catch {} $('#new').hidden = !turns.length; $('#tries').hidden = !!turns.length; };
// an empty conversation offers a start, as every chat app does; the questions suit a small local model
$('#tries').innerHTML = ['Explain a term in two sentences', 'Rewrite this paragraph more plainly:', 'Draft a short reply that says no politely']
  .map((t) => `<button class="chip plain" type="button" style="min-height:32px;border:1px solid var(--line);cursor:pointer">${M.esc(t)}</button>`).join('');
$('#tries').onclick = (e) => { const b = e.target.closest('button'); if (b) { $('#q').value = b.textContent + (b.textContent.endsWith(':') ? '\n' : ': '); $('#q').focus(); } };

function add(role, content, meta) {
  const you = role === 'user';
  const m = M.el(`<div class="msg ${you ? 'you' : 'it'}"><div class="bubble ${you ? '' : 'md'}" style="${you ? '' : 'max-width:none;margin:0;font-size:16px;line-height:26px;padding-top:4px;padding-bottom:4px'}">${you ? M.esc(content) : M.md(content)}</div>
    ${you ? '' : `<div class="meta"><span>${M.esc(meta || '')}</span><button class="ghost" data-copy>Copy</button></div>`}</div>`);
  if (!you) m.querySelector('[data-copy]').onclick = (e) => navigator.clipboard.writeText(content).then(() => { e.target.textContent = 'Copied'; setTimeout(() => (e.target.textContent = 'Copy'), 1500); M.log('action.copy_answer'); });
  $('#chat').append(m); m.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return m;
}
async function send() {
  const q = $('#q').value.trim(); if (!q) return;
  $('#q').value = ''; $('#send').disabled = true;
  add('user', q);
  const wait = M.el('<div class="msg it"><div class="bubble" style="padding:12px 18px"><span class="dots"><i></i><i></i><i></i></span><span class="muted small" data-say> loading the model, answering, unloading</span> <button class="ghost" data-cancel hidden style="min-height:26px;padding:2px 10px;font-size:12px">Cancel question</button></div></div>');
  $('#chat').append(wait); wait.scrollIntoView({ block: 'end' });
  // One model runs at a time. If a long job has it, the question waits for a turn and says so.
  const ctl = new AbortController(), t0 = Date.now();
  wait.querySelector('[data-cancel]').onclick = () => ctl.abort();
  const watch = setInterval(async () => {
    let s; try { s = await (await fetch('/api/system')).json(); } catch { return; }
    const mine = (s.line || []).findIndex((t) => t.app === M.appId), l = (s.leases || [])[0];
    const say = wait.querySelector('[data-say]'), secs = Math.round((Date.now() - t0) / 1000);
    wait.querySelector('[data-cancel]').hidden = mine < 0;
    if (mine >= 0 && l) say.textContent = ` Waiting for a turn (${secs} s). ${l.apps[0]} is using ${l.name}${l.what ? ' for ' + l.what : ''}. Your question goes ${mine ? 'after ' + mine + ' other' + (mine > 1 ? 's' : '') : 'next'}.`;
    else if (mine >= 0) say.textContent = ` Waiting for a turn (${secs} s). Your question goes next.`;
    else say.textContent = ' loading the model, answering, unloading';
  }, 1500);
  M.log('action.ask', { chars: q.length, turn: turns.length / 2 + 1 });
  try {
    const history = turns.slice(-4).map((t) => ({ role: t.role, content: t.content }));
    const res = await fetch('/api/ask', { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_id: M.appId, prompt: q, history, system: 'You are a concise, accurate assistant. Answer the latest question directly; do not repeat earlier answers. If you are not sure, say so.' }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail || 'The question could not be answered.');
    clearInterval(watch); wait.remove();
    const meta = `${r.model} · ${(r.ms / 1000).toFixed(1)} s · ${r.mb ?? '?'} MB while answering, now unloaded` + (r.waited_ms > 1500 ? ` · waited ${Math.round(r.waited_ms / 1000)} s for a turn` : '');
    turns.push({ role: 'user', content: q }, { role: 'assistant', content: r.text, meta }); save();
    add('assistant', r.text, meta);
  } catch (e) {
    clearInterval(watch); wait.remove();
    if (e.name === 'AbortError') { add('assistant', 'Question cancelled. Nothing was run.', 'cancelled'); M.log('action.cancel_question', { waited_s: Math.round((Date.now() - t0) / 1000) }); }
    else add('assistant', e.message, 'not answered');
  }
  $('#send').disabled = false; $('#q').focus();
}
$('#send').onclick = send;
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#new').onclick = () => { turns = []; save(); document.querySelectorAll('.msg').forEach((m) => m.remove()); M.log('action.new_conversation'); $('#q').focus(); };
M.ready.then((app) => {
  const n = app.needs[0];
  $('#model').textContent = n.ready ? `Model: ${n.model}` : 'The assistant model is not ready';
  $('#why').textContent = n.ready ? `About ${n.est_mb} MB while it answers, nothing between questions. It runs entirely on this device. Small models are quick and private but make mistakes; check anything that matters.` : n.hint;
  turns.forEach((t) => add(t.role, t.content, t.meta)); save();
  $('#q').focus();
});
</script>
</body>
</html>
